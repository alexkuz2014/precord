name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.5.0 (empty = 1.5.<run number>)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - name: Test engine
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Pick version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"
          elif [[ -n "${{ inputs.version }}" ]]; then TAG="v${{ inputs.version }}"
          else TAG="v1.5.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Restore upload keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.PRECORD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/precord.jks"
            echo "PRECORD_KEYSTORE_PATH=$RUNNER_TEMP/precord.jks" >> "$GITHUB_ENV"
            echo "PRECORD_KEYSTORE_PASSWORD=${{ secrets.PRECORD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "PRECORD_KEY_ALIAS=${{ secrets.PRECORD_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "PRECORD_KEY_PASSWORD=${{ secrets.PRECORD_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: release builds are signed with the debug key (fine for sideloading, NOT for Google Play)."
          fi
      - name: Build APK (full) and AAB (play)
        run: |
          ./gradlew assembleFullRelease bundlePlayRelease \
            -Pprecord.versionCode=${{ github.run_number }} -Pprecord.versionName=${{ steps.ver.outputs.name }}
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*.apk "dist/precord-${{ steps.ver.outputs.tag }}.apk"
          cp app/build/outputs/bundle/playRelease/*.aab "dist/precord-play-${{ steps.ver.outputs.tag }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: precord-release
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release (creates the tag if missing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
