name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Rust + cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - name: Test engine
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build release APK (signed with the debug key; replace with your keystore for store distribution)
        run: |
          sdkmanager "ndk;27.2.12479018"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/*.apk precord-${GITHUB_REF_NAME:-dev}.apk
      - uses: actions/upload-artifact@v4
        with: { name: precord-apk, path: precord-*.apk }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: "precord-*.apk", generate_release_notes: true }
