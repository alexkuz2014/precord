name: android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Rust toolchain
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - name: Rust unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build debug APK
        run: |
          echo "SDK=$ANDROID_HOME NDK=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" || { echo "no preinstalled NDK"; exit 1; }
          ./gradlew assembleFullDebug assemblePlayDebug
      - uses: actions/upload-artifact@v4
        with:
          name: precord-debug-apk
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
